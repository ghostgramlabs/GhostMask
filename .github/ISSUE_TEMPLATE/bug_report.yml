name: Bug report
description: Something in GhostMask crashed, misbehaved or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
  - type: input
    id: context
    attributes:
      label: Context
      description: Which screen you were on, the cover image size, and whether it was hide or reveal
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: "Pixel 8, Android 16"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GhostMask version
      description: Android Settings > Apps > GhostMask
      placeholder: "1.0.0"
    validations:
      required: true
